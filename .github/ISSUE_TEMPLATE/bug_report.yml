name: Bug Report
description: Create a report to help us improve MUSICA
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please ensure you are running the latest version of MUSICA before submitting.
  - type: input
    id: app-version
    attributes:
      label: MUSICA Version
      description: What version of MUSICA are you using? (Check Settings -> About)
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android Version & Device
      description: What device model and Android OS version are you running?
      placeholder: e.g. Google Pixel 8 Pro, Android 14
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      value: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or Screenshots
      description: Paste any logcat output or attach screenshots if applicable.
